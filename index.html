saved(){return`<button class="s" onclick="V='more';render()">← Więcej</button><h1>Zapisane</h1>${S.saved.length?S.saved.map(s=>`<div class="card"><b>${E(s.name)}</b><div class="mu">${E(s.addr||'')}</div><div class="row" style="margin-top:6px"><button class="p s" onclick="go(S.saved.find(x=>x.id=='${s.id}'))">Nawiguj</button><button class="s d" onclick="S.saved=S.saved.filter(x=>x.id!='${s.id}');save();render()">Usuń</button></div></div>`).join(''):'<div class="empty">Nic nie zapisano. Użyj „Zapisz” przy spocie.</div>'}`},
settings(){return`<button class="s" onclick="V='more';render()">← Więcej</button><h1>Ustawienia</h1><div class="card"><label>Nazwa użytkownika</label><input value="${E(S.prefs.name)}" onchange="S.prefs.name=this.value;save()"><label>Preferowana nawigacja</label><div class="row"><button class="${S.prefs.nav==='google'?'on':''}" onclick="S.prefs.nav='google';save();render()">Google Maps</button><button class="${S.prefs.nav==='apple'?'on':''}" onclick="S.prefs.nav='apple';save();render()">Apple Maps</button></div><label>Motyw</label><div class="row">${[['auto','Auto'],['dark','Ciemny'],['light','Jasny']].map(t=>`<button class="${S.prefs.theme===t[0]?'on':''}" onclick="S.prefs.theme='${t[0]}';save();applyTheme();render()">${t[1]}</button>`).join('')}</div></div><button class="d" onclick="U=null;ST.set('cg_session',null);render()">Wyloguj</button>`},
admin(){if(acct(U).role!=='admin')return VIEWS.more();return`<button class="s" onclick="V='more';render()">← Więcej</button><h1>Panel admina</h1><div class="mu">Dane lokalne tej przeglądarki (prototyp).</div>${allUsers().map(u=>{const d=ST.get('cg_'+u,null)||{cars:[],exp:[],spots:[],events:[]};return`<div class="card"><b>${u}</b> <span class="tag">${acct(u).role}</span><div class="mu">Auta: ${d.cars.length} · Wydatki: ${d.exp.length} · Spoty: ${d.spots.length} · Wydarzenia: ${d.events.length}</div></div>`}).join('')}<h2>Spoty (moderacja)</h2>${allUsers().flatMap(u=>(ST.get('cg_'+u,{spots:[]}).spots||[]).map(s=>`<div class="card row sp"><div>${E(s.name)}<div class="mu">${u}</div></div><button class="s d" onclick="admDel('${u}','${s.id}')">Usuń</button></div>`)).join('')||'<div class="empty">Brak spotów.</div>'}`}};
// ---- actions
function del(k,id,back){if(!confirm('Na pewno usunąć?'))return;S[k]=S[k].filter(x=>x.id!==id);if(k==='cars'){S.exp=S.exp.filter(e=>e.car!==id);cur=null}save();render()}
function admDel(u,id){if(acct(U).role!=='admin'||!confirm('Usunąć wpis?'))return;const d=ST.get('cg_'+u);d.spots=d.spots.filter(s=>s.id!==id);ST.set('cg_'+u,d);if(u===U)S=d;render()}
function svp(id){const s=S.spots.find(x=>x.id===id),i=S.saved.findIndex(x=>x.id===id);i<0?S.saved.push({...s}):S.saved.splice(i,1);save();render()}
function evS(id,v){const e=S.events.find(x=>x.id===id);e.st=e.st===v?'':v;save();render()}
function addCar(id){const c=S.cars.find(x=>x.id===id)||{};window.PEinit=c.photo||null;form(id?'Edytuj auto':'Nowe auto',fld('brand','Marka','text',c.brand)+fld('model','Model','text',c.model)+fld('gen','Generacja','text',c.gen)+fld('year','Rok produkcji','number',c.year)+fld('engine','Silnik','text',c.engine)+fld('cap','Pojemność','text',c.cap)+fld('hp','Moc (KM)','number',c.hp)+fld('fuel','Paliwo','text',c.fuel||'benzyna',['benzyna','diesel','LPG','hybryda','elektryczny'])+fld('km','Przebieg (km)','number',c.km)+fld('color','Kolor','text',c.color)+fld('vin','VIN (opcjonalnie, prywatny)','text',c.vin)+fld('bought','Data zakupu','date',c.bought)+fld('price','Cena zakupu (zł)','number',c.price),d=>{if(!d.brand||!d.model)return'Podaj markę i model.';if([d.hp,d.km,d.price].some(v=>v!==''&&v!=null&&+v<0))return'Wartości liczbowe nie mogą być ujemne.';if(d.year&&(d.year<1900||d.year>2100))return'Nieprawidłowy rok.';id?Object.assign(c,d):S.cars.push({id:uid(),...d})},photoF)}
function addExp(car,id){if(!S.cars.length){toast('Najpierw dodaj auto w Garażu');return addCar()}const e=S.exp.find(x=>x.id===id)||{};form(id?'Edytuj wydatek':'Nowy wydatek',fld('car','Które auto?','',e.car||car||S.cars[0].id,S.cars.map(c=>({v:c.id,l:c.brand+' '+c.model})))+fld('what','Co?','text',e.what)+fld('amt','Ile? (PLN)','number',e.amt)+fld('date','Kiedy?','date',e.date||today())+fld('cat','Kategoria','',e.cat,CATS)+fld('km','Przebieg (opcjonalnie)','number',e.km)+fld('note','Notatka','area',e.note),d=>{if(!d.what)return'Podaj, na co wydano.';if(!(+d.amt>0))return'Kwota musi być większa od zera.';if(!d.date)return'Podaj datę.';id?Object.assign(e,d):S.exp.push({id:uid(),...d})},photoF)}
function addSpot(){form('Nowy spot / miejsce',fld('name','Nazwa','text')+fld('cat','Kategoria','',null,SPOTC)+fld('addr','Adres lub opis dojazdu','text')+fld('lat','Szerokość geogr. (opcjonalnie)','number')+fld('lng','Długość geogr. (opcjonalnie)','number')+fld('desc','Opis','area'),d=>{if(!d.name)return'Podaj nazwę.';if(!d.addr&&!d.lat)return'Podaj adres lub współrzędne.';S.spots.push({id:uid(),...d})},photoF)}
function addEv(){form('Nowe wydarzenie',fld('name','Nazwa','text')+fld('date','Data','date')+fld('time','Godzina','time')+fld('addr','Lokalizacja','text')+fld('desc','Opis','area'),d=>{if(!d.name||!d.date)return'Podaj nazwę i datę.';S.events.push({id:uid(),...d,st:''})})}
function nearGo(){const c=$('#nc').value,w=$('#nw').value.trim();if(!w)return toast('Wpisz miasto lub adres');const t=c+' '+w;window.open(S.prefs.nav==='apple'?'https://maps.apple.com/?q='+encodeURIComponent(t):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(t),'_blank','noopener')}
function nearGeo(){if(!navigator.geolocation)return toast('Brak obsługi lokalizacji');navigator.geolocation.getCurrentPosition(p=>{const c=$('#nc').value,l=p.coords.latitude+','+p.coords.longitude;window.open(S.prefs.nav==='apple'?`https://maps.apple.com/?q=${encodeURIComponent(c)}&sll=${l}`:`https://www.google.com/maps/search/${encodeURIComponent(c)}/@${l},13z`,'_blank','noopener')},()=>toast('Brak zgody na lokalizację — wpisz miasto ręcznie'))}
function csv(){const r=[['data','auto','co','kategoria','kwota','przebieg','notatka'],...S.exp.map(e=>[e.date,carN(e.car),e.what,e.cat,e.amt,e.km||'',e.note||''])];const t=r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='wydatki.csv';a.click()}
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('[role=button]')){e.preventDefault();t.click()}});
U=ST.get('cg_session',null);if(U&&!acct(U))U=null;if(U)load();{const h=location.hash.slice(1);if(U&&PRIV.includes(h))V=h}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(U&&PRIV.includes(v)&&v!==V){V=v;cur=null;render()}});render();
