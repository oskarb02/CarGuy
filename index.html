<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarGuy — garaż, koszty i spoty dla car guyów</title><meta name="description" content="CarGuy: garaż i ewidencja wydatków, spoty, wyszukiwanie warsztatów w okolicy oraz nawigacja w Google Maps lub Apple Maps."><meta name="theme-color" content="#0e0f11">
<style>
:root{--bg:#0e0f11;--card:#191b1f;--line:#2a2d33;--tx:#f4f4f2;--mu:#8d9199;--ac:#ff6a1a;--acx:#111;--rd:#ff6b5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f2ef;--card:#fff;--line:#dcdcd6;--tx:#15161a;--mu:#6a6e76;--acx:#111;--ac:#e8590c}}
:root[data-theme="light"]{--bg:#f2f2ef;--card:#fff;--line:#dcdcd6;--tx:#15161a;--mu:#6a6e76;--ac:#e8590c}
:root[data-theme="dark"]{--bg:#0e0f11;--card:#191b1f;--line:#2a2d33;--tx:#f4f4f2;--mu:#8d9199}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI","Roboto",system-ui,sans-serif}
h1,h2,h3{font-family:"Arial Narrow","Roboto Condensed","Bahnschrift",sans-serif;margin:0;letter-spacing:.2px}
h1{font-size:30px}h2{font-size:22px;margin:18px 0 8px}h3{font-size:18px}
#app{max-width:760px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font:700 28px "Arial Narrow","Roboto Condensed","Bahnschrift",sans-serif;color:var(--ac)}.mu{color:var(--mu);font-size:13px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input,select,textarea{width:100%}label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mu)}
button{cursor:pointer}button.p{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}button.d{color:var(--rd)}button.s{min-height:36px;padding:6px 10px;font-size:13px}
button.on{background:var(--ac);color:#111;border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;padding:6px 2px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;font-weight:400}nav button.on{color:var(--ac);background:none}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;z-index:6;padding:0}
.bar{height:8px;background:var(--ac);border-radius:4px}.tag{font-size:11px;border:1px solid var(--ac);color:var(--ac);border-radius:6px;padding:1px 6px}
.ph{width:100%;height:120px;object-fit:cover;border-radius:8px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:8px}
#mo{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:flex-end;justify-content:center}
#mo>div{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.login{max-width:360px;margin:12vh auto 0}.err{color:var(--rd);font-size:13px;min-height:18px}
.empty{text-align:center;color:var(--mu);padding:24px}
.logo{font-size:56px;line-height:1;letter-spacing:1px}.logo span{color:var(--ac)}
.lead{font-size:17px;margin:8px 0 12px}.feat{list-style:none;padding:0;margin:0 0 16px;color:var(--mu)}.feat li{padding:4px 0 4px 18px;position:relative}.feat li:before{content:"";position:absolute;left:0;top:.9em;width:8px;height:3px;background:var(--ac)}
.login{animation:in .5s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card,button{transition:border-color .15s,background .15s,transform .1s,filter .15s}
.card[role=button]{cursor:pointer}.card[role=button]:hover,button:hover:not(:disabled){border-color:var(--ac)}.card[role=button]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.p:hover:not(:disabled){filter:brightness(1.1)}button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-size:16px}
@media(max-width:380px){h1{font-size:26px}.logo{font-size:46px}.g2{gap:6px}.big{font-size:23px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="app"></main><div id="mo"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const USERS={admin:{p:'admin1',role:'admin',name:'Administrator'},uzytkownik:{p:'uzytkownik1',role:'user',name:'Użytkownik'}};
const CATS=['serwis','części','paliwo','ubezpieczenie','tuning','detailing','opony','zakup auta','inne'];
const SPOTC=['spot samochodowy','miejsce foto','punkt widokowy','tor','drift','karting','trasa','garaż społecznościowy'];
const NEAR=['mechanik','detailing','wulkanizacja','lakiernik','blacharz','myjnia samochodowa','warsztat tuningowy','sklep motoryzacyjny','stacja kontroli pojazdów','parking','stacja paliw','ładowarka EV','tor wyścigowy','karting'];
const ST={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Brak miejsca w pamięci — usuń zdjęcia')}}};
let U=null,S=null,V='home',per='month',fc='all',q='',cur=null;
const uid=()=>Math.random().toString(36).slice(2,9),zl=n=>(+n||0).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł',today=()=>new Date().toISOString().slice(0,10);
function load(){S=ST.get('cg_'+U,null);if(!S){S={cars:[],exp:[],spots:[],events:[],saved:[],rem:[],prefs:{nav:'google',theme:'auto',name:USERS[U].name}};addDemo(1)}applyTheme()}
const dAgo=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10),P='[PRZYKŁAD] ';
function addDemo(quiet){if(S.cars.some(c=>c.demo))return;S.cars.push({id:'dc1',demo:1,brand:'BMW',model:'330i',gen:'E90',year:2008,engine:'N52',cap:'3.0',hp:258,fuel:'benzyna',km:187000,color:'szary',bought:dAgo(300),price:32000},{id:'dc2',demo:1,brand:'Mazda',model:'MX-5',gen:'NC',year:2011,engine:'MZR',cap:'2.0',hp:160,fuel:'benzyna',km:121000,color:'czerwony',bought:dAgo(120),price:28000});
[['dc1','Zakup auta',32000,'zakup auta',300],['dc1','Wymiana oleju i filtrów',480,'serwis',90],['dc1','Paliwo',310,'paliwo',3],['dc1','Klocki i tarcze przód',950,'części',40],['dc1','Felgi 18"',2800,'tuning',150],['dc1','Ubezpieczenie OC',1250,'ubezpieczenie',60],['dc2','Zakup auta',28000,'zakup auta',120],['dc2','Opony letnie',1600,'opony',75],['dc2','Detailing — powłoka ceramiczna',1200,'detailing',20],['dc2','Paliwo',260,'paliwo',1],['dc2','Wydech sportowy',2400,'tuning',50]].forEach((x,i)=>S.exp.push({id:'de'+i,demo:1,car:x[0],what:P+x[1],amt:x[2],cat:x[3],date:dAgo(x[4]),note:'Dane przykładowe'}));
S.spots.push({id:'ds1',demo:1,name:P+'Spot wieczorny',cat:'spot samochodowy',addr:'Warszawa, Polska',desc:'Przykładowy wpis — nie jest prawdziwym miejscem.'},{id:'ds2',demo:1,name:P+'Punkt widokowy',cat:'punkt widokowy',addr:'Kraków, Polska',desc:'Przykładowy wpis — nie jest prawdziwym miejscem.'});
S.events.push({id:'dv1',demo:1,name:P+'Zlot na parkingu',date:dAgo(-10),time:'18:00',addr:'Warszawa, Polska',desc:'Przykładowe wydarzenie.',st:''},{id:'dv2',demo:1,name:P+'Track day',date:dAgo(-30),time:'09:00',addr:'Poznań, Polska',desc:'Przykładowe wydarzenie.',st:''});
save();if(!quiet){toast('Wczytano dane przykładowe');render()}}
function rmDemo(){if(!confirm('Usunąć wszystkie dane przykładowe?'))return;['cars','exp','spots','events','saved'].forEach(k=>S[k]=S[k].filter(x=>!x.demo&&!String(x.name||'').startsWith(P)));cur=null;save();render()}
function save(){ST.set('cg_'+U,S)}
function applyTheme(){const t=S.prefs.theme;t==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',t)}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ac);color:#111;padding:8px 14px;border-radius:10px;z-index:20;font-weight:600';document.body.append(t);setTimeout(()=>t.remove(),2200)}
function modal(h){const m=$('#mo');m.innerHTML='<div>'+h+'</div>';m.style.display='flex';m.onclick=e=>{if(e.target===m)closeM()}}
function closeM(){$('#mo').style.display='none'}
function navUrl(p){const d=(p.lat!=null&&p.lat!=='')?p.lat+','+p.lng:encodeURIComponent(p.addr||p.name||'');
 return S.prefs.nav==='apple'?`https://maps.apple.com/?daddr=${d}&dirflg=d`:`https://www.google.com/maps/dir/?api=1&destination=${d}&travelmode=driving`}
function go(p){if(!p.addr&&p.lat==null)return toast('Brak lokalizacji');window.open(navUrl(p),'_blank','noopener')}
function fld(n,l,t='text',v='',o){if(o)return`<label>${l}</label><select name="${n}">${o.map(x=>`<option value="${E(x.v??x)}"${(x.v??x)==v?' selected':''}>${E(x.l??x)}</option>`).join('')}</select>`;
 if(t==='area')return`<label>${l}</label><textarea name="${n}" rows="2">${E(v)}</textarea>`;
 return`<label>${l}</label><input name="${n}" type="${t}" value="${E(v)}"${t==='number'?' step="any"':''}>`}
function form(title,fields,onSave,extra=''){modal(`<h2>${title}</h2><form id="f" onsubmit="return false">${fields}${extra}<div class="err" id="fe"></div><div class="row"><button class="p" id="fs">Zapisz</button><button type="button" onclick="closeM()">Anuluj</button></div></form>`);
 $('#fs').onclick=async()=>{const f=$('#f'),d=Object.fromEntries(new FormData(f));const ph=f.querySelector('[type=file]');if(ph&&ph.files[0])d.photo=await img(ph.files[0]);const er=onSave(d);if(er)$('#fe').textContent=er;else{save();closeM();render()}}}
const photoF='<label>Zdjęcie (opcjonalnie)</label><input type="file" accept="image/*">';
function img(file){return new Promise(r=>{const i=new Image,fr=new FileReader;fr.onload=()=>{i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,500/i.width);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=fr.result};fr.readAsDataURL(file)})}
const ph=(p,e)=>p?`<img class="ph" src="${p}" alt="Zdjęcie auta">`:`<div class="ph">${e}</div>`;
const carN=id=>{const c=S.cars.find(x=>x.id===id);return c?c.brand+' '+c.model:'(usunięte auto)'};
// ---- ranges
function inP(d,p){const n=new Date(),x=new Date(d);if(p==='all')return true;if(p==='year')return x.getFullYear()===n.getFullYear();if(p==='month')return x.getFullYear()===n.getFullYear()&&x.getMonth()===n.getMonth();return(n-x)/864e5<7&&x<=n}
const sum=a=>a.reduce((s,e)=>s+ +e.amt,0);
// ---- views
function login(){$('#app').innerHTML=`<div class="login"><h1 class="logo">CAR<span>GUY</span></h1><p class="lead">Twój garaż w kieszeni: ile kosztuje każde auto, gdzie jest dobry warsztat i dokąd pojechać na spot.</p><ul class="feat"><li>Garaż i wydatki z podsumowaniami</li><li>Spoty i wyszukiwanie firm w okolicy</li><li>Nawigacja w Google Maps lub Apple Maps</li></ul><form onsubmit="return false"><label>Login</label><input id="lu" autocomplete="username" autocapitalize="none"><label>Hasło</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="le"></div><button class="p" style="width:100%" id="lb">Zaloguj</button></form><p class="mu">Prototyp: konta demo (admin / admin1, uzytkownik / uzytkownik1) są sprawdzane w przeglądarce. To nie jest zabezpieczenie — publiczna wersja wymaga logowania i kontroli dostępu po stronie serwera.</p></div>`;
 $('#lb').onclick=()=>{const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;if(USERS[u]&&USERS[u].p===p){U=u;ST.set('cg_session',u);load();V='home';render()}else $('#le').textContent='Nieprawidłowy login lub hasło.'}}
function render(){if(!U)return login();const tabs=[['home','🏠','Home'],['spots','📍','Spoty'],['near','🔎','Okolica'],['calc','💳','Wydatki'],['garage','🚗','Garaż'],['more','☰','Więcej']];
 const main=['home','spots','near','calc','garage'].includes(V)?V:'more';
 $('#app').innerHTML=(VIEWS[V]||VIEWS.home)()+`<nav aria-label="Główna nawigacja">${tabs.map(t=>`<button class="${t[0]===main?'on':''}" onclick="V='${t[0]}';cur=null;render();scrollTo(0,0)"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav><button class="p fab" onclick="quickAdd()" aria-label="Dodaj">+</button>`}
function quickAdd(){modal(`<h2>Dodaj</h2><div class="g2"><button onclick="addExp()">Wydatek</button><button onclick="addCar()">Samochód</button><button onclick="addSpot()">Spot / miejsce</button><button onclick="addEv()">Wydarzenie</button></div>`)}
const VIEWS={
home(){const m=S.exp.filter(e=>inP(e.date,'month')),last=[...S.exp].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4),lc=S.cars[S.cars.length-1],ev=[...S.events].filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
 return`<h1>Cześć, ${E(S.prefs.name)}</h1><div class="card row sp"><span class="mu">${S.cars.some(c=>c.demo)?'Widzisz dane przykładowe (oznaczone [PRZYKŁAD]).':'Chcesz zobaczyć aplikację z danymi?'}</span>${S.cars.some(c=>c.demo)?'<button class="s d" onclick="rmDemo()">Usuń przykładowe</button>':'<button class="s" onclick="addDemo()">Wczytaj przykładowe</button>'}</div><div class="g2"><div class="card"><div class="mu">Auta w garażu</div><div class="big">${S.cars.length}</div></div><div class="card"><div class="mu">Wydano łącznie</div><div class="big">${zl(sum(S.exp))}</div></div></div>
 <div class="card"><div class="mu">Ten miesiąc</div><div class="big">${zl(sum(m))}</div></div>
 <div class="g2"><button class="p" onclick="addExp()">+ Dodaj wydatek</button><button onclick="V='near';render()">Znajdź w okolicy</button></div>
 <h2>Ostatnie wydatki</h2>${last.length?last.map(e=>`<div class="card row sp"><div>${E(e.what)}<div class="mu">${carN(e.car)} · ${e.date}</div></div><b>${zl(e.amt)}</b></div>`).join(''):'<div class="empty">Brak wydatków. Dodaj pierwszy przyciskiem powyżej.</div>'}
 <h2>Ostatnio dodane auto</h2>${lc?`<div class="card">${ph(lc.photo,'🚗')}<h3>${E(lc.brand)} ${E(lc.model)}</h3><div class="mu">${E(lc.year)} · ${E(lc.hp||'?')} KM</div></div>`:'<div class="empty">Garaż jest pusty.</div>'}
 <h2>Najbliższe wydarzenia</h2>${ev.length?ev.map(e=>`<div class="card"><b>${E(e.name)}</b><div class="mu">${e.date} · ${E(e.addr||'')}</div></div>`).join(''):'<div class="empty">Brak nadchodzących wydarzeń. Dodaj je w Więcej → Wydarzenia.</div>'}`},
garage(){if(cur)return VIEWS.car();return`<div class="row sp"><h1>Garaż</h1><button class="p s" onclick="addCar()">+ Auto</button></div>${S.cars.length?S.cars.map(c=>`<div class="card" role="button" tabindex="0" aria-label="Otwórz ${E(c.brand)} ${E(c.model)}" onclick="cur='${c.id}';render()">${ph(c.photo,'🚗')}<h3>${E(c.brand)} ${E(c.model)} ${E(c.gen)}</h3><div class="mu">${E(c.year)} · ${E(c.engine||'')} ${c.hp?c.hp+' KM':''} · ${c.km?Number(c.km).toLocaleString('pl-PL')+' km':''}</div></div>`).join(''):'<div class="empty">Nie masz jeszcze aut. Dodaj pierwsze.</div>'}`},
car(){const c=S.cars.find(x=>x.id===cur);if(!c){cur=null;return VIEWS.garage()}const ex=S.exp.filter(e=>e.car===c.id),op=ex.filter(e=>e.cat!=='zakup auta'),buy=ex.filter(e=>e.cat==='zakup auta');
 const bp=buy.length?sum(buy):+c.price||0,mo=c.bought?Math.max(1,(Date.now()-new Date(c.bought))/2628e6):1;
 const by=CATS.map(k=>[k,sum(ex.filter(e=>e.cat===k))]).filter(x=>x[1]>0);
 return`<button class="s" onclick="cur=null;render()">← Garaż</button><div class="card" style="margin-top:10px">${ph(c.photo,'🚗')}<h1>${E(c.brand)} ${E(c.model)}</h1><div class="mu">${E(c.gen)} ${E(c.year)} · ${E(c.engine||'')} ${E(c.cap||'')} · ${E(c.hp||'?')} KM · ${E(c.fuel)} · ${E(c.color||'')}${c.vin?' · VIN '+E(c.vin)+' (prywatny)':''}</div></div>
 <div class="g2"><div class="card"><div class="mu">Cena zakupu</div><div class="big">${zl(bp)}</div></div><div class="card"><div class="mu">Koszty eksploatacji</div><div class="big">${zl(sum(op))}</div></div><div class="card"><div class="mu">Eksploatacja / mies.</div><div class="big">${zl(sum(op)/mo)}</div></div><div class="card"><div class="mu">Razem (zakup + eksploatacja)</div><div class="big">${zl(bp+sum(op))}</div></div></div>
 <div class="mu">Cenę zakupu liczymy raz: z wydatku „zakup auta”, a jeśli go nie ma — z karty auta.${c.km&&c.kmStart?'':' Koszt na km pojawi się, gdy dodasz przebieg przy wydatkach.'}</div>
 <h2>Wydatki wg kategorii</h2>${by.length?by.map(x=>`<div class="mu">${x[0]} — ${zl(x[1])}</div><div class="bar" style="width:${x[1]/Math.max(...by.map(y=>y[1]))*100}%"></div>`).join(''):'<div class="empty">Brak wydatków dla tego auta.</div>'}
 <div class="row" style="margin-top:14px"><button class="p" onclick="addExp('${c.id}')">+ Wydatek</button><button onclick="addCar('${c.id}')">Edytuj</button><button class="d" onclick="del('cars','${c.id}',1)">Usuń</button></div>`},
calc(){let L=S.exp.filter(e=>(fc==='all'||e.car===fc)&&(!q||(e.what+e.note).toLowerCase().includes(q.toLowerCase())));const P=L.filter(e=>inP(e.date,per)),n=P.length,t=sum(P),mx=n?Math.max(...P.map(e=>+e.amt)):0,by=CATS.map(k=>[k,sum(P.filter(e=>e.cat===k))]).filter(x=>x[1]>0);
 const days={};P.forEach(e=>{const k=per==='year'||per==='all'?e.date.slice(0,7):e.date;days[k]=(days[k]||0)+ +e.amt});const ks=Object.keys(days).sort(),mm=Math.max(1,...Object.values(days));
 return`<div class="row sp"><h1>Wydatki</h1><button class="p s" onclick="addExp()">+ DODAJ WYDATEK</button></div>
 <div class="row">${[['week','Tydzień'],['month','Miesiąc'],['year','Rok'],['all','Ogólnie']].map(p=>`<button class="s ${per===p[0]?'on':''}" onclick="per='${p[0]}';render()">${p[1]}</button>`).join('')}</div>
 <div class="row" style="margin-top:8px"><select onchange="fc=this.value;render()" style="flex:1"><option value="all">Wszystkie auta</option>${S.cars.map(c=>`<option value="${c.id}"${fc===c.id?' selected':''}>${E(c.brand+' '+c.model)}</option>`).join('')}</select></div>
 <div class="g2" style="margin-top:8px"><div class="card"><div class="mu">Suma</div><div class="big">${zl(t)}</div></div><div class="card"><div class="mu">Liczba</div><div class="big">${n}</div></div><div class="card"><div class="mu">Średni</div><div class="big">${zl(n?t/n:0)}</div></div><div class="card"><div class="mu">Największy</div><div class="big">${zl(mx)}</div></div></div>
 ${by.length?`<h2>Kategorie</h2>`+by.map(x=>`<div class="mu">${x[0]} — ${zl(x[1])}</div><div class="bar" style="width:${x[1]/t*100}%"></div>`).join('')+`<h2>W czasie</h2><div class="card row" style="align-items:flex-end;height:120px;overflow-x:auto;flex-wrap:nowrap">${ks.map(k=>`<div title="${k}: ${zl(days[k])}" style="flex:1;min-width:10px;background:var(--ac);border-radius:3px;height:${days[k]/mm*100}%"></div>`).join('')}</div>`:''}
 <h2>Lista</h2><input placeholder="Szukaj wydatku…" value="${E(q)}" oninput="q=this.value;clearTimeout(window.qt);window.qt=setTimeout(()=>{render();const i=document.querySelector('input[placeholder^=Szukaj]');i.focus();i.setSelectionRange(99,99)},300)">
 ${P.length?[...P].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="card row sp"><div><b>${E(e.what)}</b><div class="mu">${carN(e.car)} · ${e.cat} · ${e.date}${e.km?' · '+e.km+' km':''}</div></div><div class="row"><b>${zl(e.amt)}</b><button class="s" onclick="addExp(null,'${e.id}')">✎</button><button class="s d" onclick="del('exp','${e.id}')">✕</button></div></div>`).join(''):'<div class="empty">Brak wydatków w tym zakresie.</div>'}
 <button onclick="csv()" style="margin-top:8px">Eksport CSV</button>`},
spots(){return`<div class="row sp"><h1>Spoty</h1><button class="p s" onclick="addSpot()">+ Spot</button></div><div class="card mu">Brak wbudowanych miejsc — nie podajemy wymyślonych lokalizacji. Dodaj własne spoty, a „Nawiguj” otworzy ${S.prefs.nav==='apple'?'Apple Maps':'Google Maps'}. Mapa Leaflet i dane o miejscach wymagają podłączenia źródła (patrz Okolica).</div>
 ${S.spots.length?S.spots.map(s=>`<div class="card">${s.photo?`<img class="ph" src="${s.photo}" alt="Zdjęcie spotu ${E(s.name)}">`:''}<div class="row sp"><h3>${E(s.name)}</h3><span class="tag">${E(s.cat)}</span></div><div class="mu">${E(s.addr||'')} ${s.lat?`(${E(s.lat)}, ${E(s.lng)})`:''}</div><p>${E(s.desc||'')}</p><div class="row"><button class="p s" onclick="go(S.spots.find(x=>x.id=='${s.id}'))">Nawiguj</button><button class="s" onclick="svp('${s.id}')">${S.saved.some(x=>x.id==='${s.id}')?'★ Zapisano':'☆ Zapisz'}</button><button class="s d" onclick="del('spots','${s.id}')">Usuń</button></div></div>`).join(''):'<div class="empty">Nie dodałeś jeszcze spotów.</div>'}`},
near(){return`<h1>Znajdź w okolicy</h1><div class="card"><label>Czego szukasz?</label><select id="nc">${NEAR.map(x=>`<option>${x}</option>`).join('')}</select><label>Miasto lub adres</label><input id="nw" placeholder="np. Kraków"><div class="row" style="margin-top:8px"><button class="p" onclick="nearGo()">Szukaj</button><button onclick="nearGeo()">Użyj mojej lokalizacji</button></div></div>
 <div class="card mu">Lista firm z ocenami, godzinami i telefonami wymaga dostawcy danych (np. Overpass/OSM lub Google Places) — nie jest tu podłączony, a ta strona nie może łączyć się z zewnętrznymi API. Wyszukiwanie otwiera wybraną aplikację map z zapytaniem; nie wymyślamy wyników.</div>`},
more(){if(V==='events')return VIEWS.events();if(V==='saved')return VIEWS.saved();if(V==='settings')return VIEWS.settings();if(V==='admin')return VIEWS.admin();
 return`<h1>Więcej</h1>${[['events','📅','Wydarzenia'],['saved','★','Zapisane'],['settings','⚙','Profil i ustawienia']].concat(USERS[U].role==='admin'?[['admin','🛡','Panel admina']]:[]).map(x=>`<div class="card" role="button" tabindex="0" onclick="V='${x[0]}';render()"><b>${x[1]} ${x[2]}</b></div>`).join('')}<div class="card mu">Trasy, książka serwisowa i przypomnienia nie są jeszcze w tej wersji.</div>`},
events(){return`<button class="s" onclick="V='more';render()">← Więcej</button><div class="row sp"><h1>Wydarzenia</h1><button class="p s" onclick="addEv()">+ Dodaj</button></div>${S.events.length?[...S.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="card"><h3>${E(e.name)}</h3><div class="mu">${e.date} ${E(e.time||'')} · ${E(e.addr||'')}</div><p>${E(e.desc||'')}</p><div class="row"><button class="s ${e.st==='int'?'on':''}" onclick="evS('${e.id}','int')">Zainteresowany</button><button class="s ${e.st==='go'?'on':''}" onclick="evS('${e.id}','go')">Wezmę udział</button><button class="s" onclick="go(S.events.find(x=>x.id=='${e.id}'))">Nawiguj</button><button class="s d" onclick="del('events','${e.id}')">Usuń</button></div></div>`).join(''):'<div class="empty">Brak wydarzeń.</div>'}`},
saved(){return`<button class="s" onclick="V='more';render()">← Więcej</button><h1>Zapisane</h1>${S.saved.length?S.saved.map(s=>`<div class="card"><b>${E(s.name)}</b><div class="mu">${E(s.addr||'')}</div><div class="row" style="margin-top:6px"><button class="p s" onclick="go(S.saved.find(x=>x.id=='${s.id}'))">Nawiguj</button><button class="s d" onclick="S.saved=S.saved.filter(x=>x.id!='${s.id}');save();render()">Usuń</button></div></div>`).join(''):'<div class="empty">Nic nie zapisano. Użyj „Zapisz” przy spocie.</div>'}`},
settings(){return`<button class="s" onclick="V='more';render()">← Więcej</button><h1>Ustawienia</h1><div class="card"><label>Nazwa użytkownika</label><input value="${E(S.prefs.name)}" onchange="S.prefs.name=this.value;save()"><label>Preferowana nawigacja</label><div class="row"><button class="${S.prefs.nav==='google'?'on':''}" onclick="S.prefs.nav='google';save();render()">Google Maps</button><button class="${S.prefs.nav==='apple'?'on':''}" onclick="S.prefs.nav='apple';save();render()">Apple Maps</button></div><label>Motyw</label><div class="row">${[['auto','Auto'],['dark','Ciemny'],['light','Jasny']].map(t=>`<button class="${S.prefs.theme===t[0]?'on':''}" onclick="S.prefs.theme='${t[0]}';save();applyTheme();render()">${t[1]}</button>`).join('')}</div></div><button class="d" onclick="U=null;ST.set('cg_session',null);render()">Wyloguj</button>`},
admin(){if(USERS[U].role!=='admin')return VIEWS.more();return`<button class="s" onclick="V='more';render()">← Więcej</button><h1>Panel admina</h1><div class="mu">Dane lokalne tej przeglądarki (prototyp).</div>${Object.keys(USERS).map(u=>{const d=ST.get('cg_'+u,null)||{cars:[],exp:[],spots:[],events:[]};return`<div class="card"><b>${u}</b> <span class="tag">${USERS[u].role}</span><div class="mu">Auta: ${d.cars.length} · Wydatki: ${d.exp.length} · Spoty: ${d.spots.length} · Wydarzenia: ${d.events.length}</div></div>`}).join('')}<h2>Spoty (moderacja)</h2>${Object.keys(USERS).flatMap(u=>(ST.get('cg_'+u,{spots:[]}).spots||[]).map(s=>`<div class="card row sp"><div>${E(s.name)}<div class="mu">${u}</div></div><button class="s d" onclick="admDel('${u}','${s.id}')">Usuń</button></div>`)).join('')||'<div class="empty">Brak spotów.</div>'}`}};
// ---- actions
function del(k,id,back){if(!confirm('Na pewno usunąć?'))return;S[k]=S[k].filter(x=>x.id!==id);if(k==='cars'){S.exp=S.exp.filter(e=>e.car!==id);cur=null}save();render()}
function admDel(u,id){if(USERS[U].role!=='admin'||!confirm('Usunąć wpis?'))return;const d=ST.get('cg_'+u);d.spots=d.spots.filter(s=>s.id!==id);ST.set('cg_'+u,d);if(u===U)S=d;render()}
function svp(id){const s=S.spots.find(x=>x.id===id),i=S.saved.findIndex(x=>x.id===id);i<0?S.saved.push({...s}):S.saved.splice(i,1);save();render()}
function evS(id,v){const e=S.events.find(x=>x.id===id);e.st=e.st===v?'':v;save();render()}
function addCar(id){const c=S.cars.find(x=>x.id===id)||{};form(id?'Edytuj auto':'Nowe auto',fld('brand','Marka','text',c.brand)+fld('model','Model','text',c.model)+fld('gen','Generacja','text',c.gen)+fld('year','Rok produkcji','number',c.year)+fld('engine','Silnik','text',c.engine)+fld('cap','Pojemność','text',c.cap)+fld('hp','Moc (KM)','number',c.hp)+fld('fuel','Paliwo','text',c.fuel||'benzyna',['benzyna','diesel','LPG','hybryda','elektryczny'])+fld('km','Przebieg (km)','number',c.km)+fld('color','Kolor','text',c.color)+fld('vin','VIN (opcjonalnie, prywatny)','text',c.vin)+fld('bought','Data zakupu','date',c.bought)+fld('price','Cena zakupu (zł)','number',c.price),d=>{if(!d.brand||!d.model)return'Podaj markę i model.';if(d.year&&(d.year<1900||d.year>2100))return'Nieprawidłowy rok.';id?Object.assign(c,d):S.cars.push({id:uid(),...d})},photoF)}
function addExp(car,id){if(!S.cars.length){toast('Najpierw dodaj auto w Garażu');return addCar()}const e=S.exp.find(x=>x.id===id)||{};form(id?'Edytuj wydatek':'Nowy wydatek',fld('car','Które auto?','',e.car||car||S.cars[0].id,S.cars.map(c=>({v:c.id,l:c.brand+' '+c.model})))+fld('what','Co?','text',e.what)+fld('amt','Ile? (PLN)','number',e.amt)+fld('date','Kiedy?','date',e.date||today())+fld('cat','Kategoria','',e.cat,CATS)+fld('km','Przebieg (opcjonalnie)','number',e.km)+fld('note','Notatka','area',e.note),d=>{if(!d.what)return'Podaj, na co wydano.';if(!(+d.amt>0))return'Kwota musi być większa od zera.';if(!d.date)return'Podaj datę.';id?Object.assign(e,d):S.exp.push({id:uid(),...d})},photoF)}
function addSpot(){form('Nowy spot / miejsce',fld('name','Nazwa','text')+fld('cat','Kategoria','',null,SPOTC)+fld('addr','Adres lub opis dojazdu','text')+fld('lat','Szerokość geogr. (opcjonalnie)','number')+fld('lng','Długość geogr. (opcjonalnie)','number')+fld('desc','Opis','area'),d=>{if(!d.name)return'Podaj nazwę.';if(!d.addr&&!d.lat)return'Podaj adres lub współrzędne.';S.spots.push({id:uid(),...d})},photoF)}
function addEv(){form('Nowe wydarzenie',fld('name','Nazwa','text')+fld('date','Data','date')+fld('time','Godzina','time')+fld('addr','Lokalizacja','text')+fld('desc','Opis','area'),d=>{if(!d.name||!d.date)return'Podaj nazwę i datę.';S.events.push({id:uid(),...d,st:''})})}
function nearGo(){const c=$('#nc').value,w=$('#nw').value.trim();if(!w)return toast('Wpisz miasto lub adres');const t=c+' '+w;window.open(S.prefs.nav==='apple'?'https://maps.apple.com/?q='+encodeURIComponent(t):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(t),'_blank','noopener')}
function nearGeo(){if(!navigator.geolocation)return toast('Brak obsługi lokalizacji');navigator.geolocation.getCurrentPosition(p=>{const c=$('#nc').value,l=p.coords.latitude+','+p.coords.longitude;window.open(S.prefs.nav==='apple'?`https://maps.apple.com/?q=${encodeURIComponent(c)}&sll=${l}`:`https://www.google.com/maps/search/${encodeURIComponent(c)}/@${l},13z`,'_blank','noopener')},()=>toast('Brak zgody na lokalizację — wpisz miasto ręcznie'))}
function csv(){const r=[['data','auto','co','kategoria','kwota','przebieg','notatka'],...S.exp.map(e=>[e.date,carN(e.car),e.what,e.cat,e.amt,e.km||'',e.note||''])];const t=r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='wydatki.csv';a.click()}
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('[role=button]')){e.preventDefault();t.click()}});
U=ST.get('cg_session',null);if(U&&!USERS[U])U=null;if(U)load();render();
</script></body></html>
